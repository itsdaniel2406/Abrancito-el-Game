<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Abrahancito 3D - Fixed Landscape Aspect Ratio</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; }

        #game-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #000;
        }

        #canvas-container { width: 100%; height: 100%; }

        /* Minimapa */
        #minimap-card {
            position: absolute; top: 12px; left: 12px;
            width: 90px; height: 90px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.6);
            overflow: hidden; z-index: 20;
        }
        #minimap { width: 100%; height: 100%; }

        /* HUD Superior */
        #top-hud {
            position: absolute; top: 12px; left: 115px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 20;
        }

        #status-bar {
            background: rgba(15, 23, 42, 0.85); padding: 5px 10px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2); font-size: 10px; font-weight: bold;
        }
        .bar-wrap { width: 75px; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
        .hp-bar { width: 100%; height: 100%; background: #22c55e; }
        .mp-bar { width: 100%; height: 100%; background: #3b82f6; transition: width 0.2s; }

        #quest-hud {
            background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 12px;
            border: 1px solid #f59e0b; font-size: 10px; text-align: right; max-width: 200px;
        }

        /* Barra de Vida Boss */
        #boss-bar-card {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 6px;
            border: 1px solid #ef4444; text-align: center; display: none; z-index: 20;
        }
        #boss-hp { width: 140px; height: 8px; background: #7f1d1d; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        #boss-hp-fill { width: 100%; height: 100%; background: #ef4444; }

        /* Hotbar de Armas */
        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(15, 23, 42, 0.85);
            padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); z-index: 30;
        }
        .slot {
            width: 42px; height: 42px; background: rgba(255,255,255,0.1);
            border: 2px solid #475569; border-radius: 6px; display: flex;
            align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer; position: relative;
        }
        .slot.active { border-color: #f59e0b; background: rgba(245, 158, 11, 0.3); }
        .slot-ammo { position: absolute; bottom: 1px; right: 2px; font-size: 8px; font-weight: bold; color: #cbd5e1; }

        /* D-Pad Joystick */
        #dpad {
            position: absolute; left: 15px; bottom: 15px; width: 105px; height: 105px;
            display: grid; grid-template-columns: repeat(3, 35px); grid-template-rows: repeat(3, 35px);
            z-index: 30; gap: 1px;
        }
        .dp-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .dp-btn:active { background: rgba(255,255,255,0.5); }

        /* Botones de Acción */
        #action-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
        .act-btn {
            position: absolute; pointer-events: auto; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; touch-action: manipulation; backdrop-filter: blur(2px);
        }
        .act-btn:active { background: rgba(255,255,255,0.5); }

        #btn-shoot { right: 20px; bottom: 20px; width: 58px; height: 58px; background: rgba(220, 38, 38, 0.5); border-color: #ef4444; }
        #btn-aim { right: 88px; bottom: 15px; width: 40px; height: 40px; }
        #btn-jump { right: 25px; bottom: 88px; width: 42px; height: 42px; }
        #btn-mount { right: 78px; bottom: 65px; width: 38px; height: 38px; }
        #btn-interact { right: 125px; bottom: 60px; width: 38px; height: 38px; background: rgba(14, 165, 233, 0.5); }

        /* Diálogo */
        #dialogue-box {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 450px; background: rgba(15, 23, 42, 0.95);
            border: 2px solid #f59e0b; border-radius: 8px; padding: 10px 14px;
            font-size: 12px; line-height: 1.4; display: none; z-index: 40;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }

        /* Overlay de bloqueo/inicio fullscreen */
        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white; padding: 20px;
        }
        #start-btn {
            margin-top: 15px; padding: 12px 24px; background: #2563eb; color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="fullscreen-overlay">
        <h2>🎮 Modo Pantalla Completa</h2>
        <p style="margin-top: 8px; font-size: 14px; color: #94a3b8;">Toca el botón para bloquear la pantalla en Horizontal.</p>
        <button id="start-btn">JUGAR AHORA</button>
    </div>

    <div id="game-container">
        <div id="canvas-container"></div>
        <div id="crosshair"></div>

        <div id="minimap-card">
            <canvas id="minimap" width="90" height="90"></canvas>
        </div>

        <div id="boss-bar-card">
            <div style="font-size:10px; font-weight:bold; color:#ef4444;">👑 REY SOMBRA (BOSS)</div>
            <div id="boss-hp"><div id="boss-hp-fill"></div></div>
        </div>

        <div id="top-hud">
            <div id="status-bar">
                <div>LVL <span id="p-lvl" style="color:#f59e0b">1</span> (<span id="p-xp">0</span>/100 XP)</div>
                <div style="margin-top:2px;">HP <div class="bar-wrap"><div id="hp-bar" class="hp-bar"></div></div></div>
                <div style="margin-top:2px;">MP <div class="bar-wrap"><div id="mp-bar" class="mp-bar"></div></div></div>
                <div style="margin-top:2px; color:#a3e635;">🪵 Madera: <span id="wood-count">0</span></div>
            </div>
            <div id="quest-hud">
                <span id="quest-text" style="color:#fde047;">Misión: Habla con el Sabio (?)</span>
            </div>
        </div>

        <div id="dialogue-box">
            <div id="dialogue-speaker" style="color:#f59e0b; font-weight:bold; margin-bottom:3px;">NPC</div>
            <div id="dialogue-text">...</div>
        </div>

        <div id="hotbar">
            <div class="slot active" id="slot-0" onclick="selectSlot(0)">⚔️<span class="slot-ammo">∞</span></div>
            <div class="slot" id="slot-1" onclick="selectSlot(1)">🏹<span class="slot-ammo">15</span></div>
            <div class="slot" id="slot-2" onclick="selectSlot(2)">🔥<span class="slot-ammo">MP</span></div>
            <div class="slot" id="slot-3" onclick="selectSlot(3)">🪓<span class="slot-ammo">Tala</span></div>
        </div>

        <div id="dpad">
            <div></div><div class="dp-btn" id="btn-up">▲</div><div></div>
            <div class="dp-btn" id="btn-left">◀</div><div></div><div class="dp-btn" id="btn-right">▶</div>
            <div></div><div class="dp-btn" id="btn-down">▼</div><div></div>
        </div>

        <div id="action-layer">
            <div class="act-btn" id="btn-shoot">🎯</div>
            <div class="act-btn" id="btn-aim">🔍</div>
            <div class="act-btn" id="btn-jump">⬆️</div>
            <div class="act-btn" id="btn-mount">🐎</div>
            <div class="act-btn" id="btn-interact">💬</div>
        </div>
    </div>

<script>
    // Forzar pantalla completa y bloqueo de orientación landscape vía JS
    document.getElementById('start-btn').addEventListener('click', async () => {
        try {
            if (document.documentElement.requestFullscreen) {
                await document.documentElement.requestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
                await screen.orientation.lock('landscape');
            }
        } catch (e) {
            console.log('Fullscreen/Lock API no soportado directamente:', e);
        }
        document.getElementById('fullscreen-overlay').style.display = 'none';
        resize();
    });

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0284c7);
    scene.fog = new THREE.FogExp2(0x0284c7, 0.007);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const minimapCtx = document.getElementById('minimap').getContext('2d');

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfffbeb, 0.9);
    sun.position.set(40, 60, 20);
    sun.castShadow = true;
    scene.add(sun);

    let p = { lvl: 1, xp: 0, hp: 100, mp: 80, maxMp: 80, wood: 0, speed: 0.18, activeSlot: 0, questState: 0 };
    const keys = { up: false, down: false, left: false, right: false };

    // Terreno
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x15803d }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Jugador
    const playerGroup = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.5), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
    body.position.y = 0.6;
    playerGroup.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshStandardMaterial({ color: 0xfde047 }));
    head.position.y = 1.4;
    playerGroup.add(head);
    scene.add(playerGroup);

    // Árboles
    const trees = [];
    function spawnTree(x, z) {
        const tree = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2), new THREE.MeshStandardMaterial({ color: 0x78350f }));
        trunk.position.y = 1;
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.2, 3, 6), new THREE.MeshStandardMaterial({ color: 0x166534 }));
        leaves.position.y = 2.8;
        tree.add(trunk); tree.add(leaves);
        tree.position.set(x, 0, z);
        scene.add(tree);
        trees.push({ mesh: tree, hp: 3, x, z });
    }
    for(let i=0; i<35; i++) {
        let rx = (Math.random() - 0.5) * 200;
        let rz = (Math.random() - 0.5) * 200;
        if(Math.abs(rx) > 10 || Math.abs(rz) > 10) spawnTree(rx, rz);
    }

    // NPCs
    const npcs = [
        { id: 'sabio', name: 'Sabio Erudito', pos: new THREE.Vector3(8, 0, 8), color: 0x0284c7 },
        { id: 'herrero', name: 'Herrero Vulcan', pos: new THREE.Vector3(-12, 0, 15), color: 0xd97706 },
        { id: 'guardian', name: 'Guardia del Castillo', pos: new THREE.Vector3(25, 0, -20), color: 0xdc2626 }
    ];

    npcs.forEach(npc => {
        const g = new THREE.Group();
        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4), new THREE.MeshStandardMaterial({ color: npc.color }));
        b.position.y = 0.7;
        g.add(b);
        g.position.copy(npc.pos);
        scene.add(g);
        npc.mesh = g;
    });

    // Enemigos
    const enemies = [];
    function spawnEnemy(x, z, isBoss = false) {
        const scale = isBoss ? 2.5 : 1;
        const mesh = new THREE.Mesh(
            new THREE.ConeGeometry(0.6 * scale, 1.6 * scale, 8),
            new THREE.MeshStandardMaterial({ color: isBoss ? 0x991b1b : 0x4c1d95 })
        );
        mesh.rotation.x = Math.PI;
        mesh.position.set(x, 0.8 * scale, z);
        scene.add(mesh);
        enemies.push({ mesh, hp: isBoss ? 250 : 40, maxHp: isBoss ? 250 : 40, isBoss });
    }

    spawnEnemy(-15, 15); spawnEnemy(15, -20); spawnEnemy(-25, -15); spawnEnemy(30, 20);
    spawnEnemy(35, -35, true);

    const vfxList = [];
    const projectiles = [];

    const randomLore = [
        "Dicen que el Rey Sombra solía ser un caballero de honor antes de tocar la reliquia.",
        "Si necesitas madera para comerciar, usa el hacha cerca del bosque del este.",
        "Los hechizos de fuego consumen maná rápidamente, úsalos con prudencia.",
        "Se rumorea que completar misiones en el minimapa otorga recompensas legendarias."
    ];

    function selectSlot(i) {
        p.activeSlot = i;
        document.querySelectorAll('.slot').forEach((s, idx) => s.classList.toggle('active', idx === i));
    }

    function showDialogue(speaker, text) {
        const box = document.getElementById('dialogue-box');
        document.getElementById('dialogue-speaker').textContent = speaker;
        document.getElementById('dialogue-text').textContent = text;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 4500);
    }

    function executeAttack() {
        if(p.activeSlot === 2) {
            if(p.mp >= 20) {
                p.mp -= 20;
                updateHUD();

                const fireball = new THREE.Mesh(
                    new THREE.SphereGeometry(0.4, 12, 12),
                    new THREE.MeshBasicMaterial({ color: 0xff4500 })
                );
                
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
                fireball.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1, 0));
                
                scene.add(fireball);
                projectiles.push({ mesh: fireball, dir, speed: 0.6, life: 60 });
            } else {
                showDialogue("Sistema", "¡No tienes suficiente Maná (MP)!");
            }
            return;
        }

        if(p.activeSlot === 0 || p.activeSlot === 3) {
            const slash = new THREE.Mesh(
                new THREE.RingGeometry(0.5, 1.2, 8, 1, 0, Math.PI),
                new THREE.MeshBasicMaterial({ color: p.activeSlot === 3 ? 0xf59e0b : 0x38bdf8, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
            );
            slash.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1, 0));
            slash.rotation.copy(playerGroup.rotation);
            slash.rotation.x = Math.PI / 2;
            scene.add(slash);
            vfxList.push({ mesh: slash, life: 10 });

            if(p.activeSlot === 3) {
                trees.forEach((t, i) => {
                    if(t.mesh.position.distanceTo(playerGroup.position) < 2.5) {
                        t.hp--;
                        if(t.hp <= 0) {
                            scene.remove(t.mesh);
                            trees.splice(i, 1);
                            p.wood += 3;
                            if(p.questState === 2 && p.wood >= 5) p.questState = 3;
                            updateHUD();
                        }
                    }
                });
            }

            enemies.forEach((enemy, i) => {
                if(enemy.mesh.position.distanceTo(playerGroup.position) < 3.5) {
                    damageEnemy(enemy, i, 20);
                }
            });
        }
    }

    function damageEnemy(enemy, index, amount) {
        enemy.hp -= amount;
        if(enemy.isBoss) {
            document.getElementById('boss-bar-card').style.display = 'block';
            document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (enemy.hp / enemy.maxHp)*100)}%`;
        }
        if(enemy.hp <= 0) {
            if(enemy.isBoss) {
                document.getElementById('boss-bar-card').style.display = 'none';
                if(p.questState === 4) p.questState = 5;
            }
            scene.remove(enemy.mesh);
            enemies.splice(index, 1);
            p.xp += enemy.isBoss ? 200 : 40;
            if(p.questState === 1) p.questState = 2;
            updateHUD();
        }
    }

    function interactNPC() {
        npcs.forEach(npc => {
            if(playerGroup.position.distanceTo(npc.pos) < 4) {
                if(npc.id === 'sabio') {
                    if(p.questState === 0) { p.questState = 1; showDialogue(npc.name, "Derrota a las Sombras del Valle para probar tu valor."); }
                    else if(p.questState === 2) { showDialogue(npc.name, "¡Gran trabajo! Ve con el Herrero en el oeste."); }
                    else showDialogue(npc.name, randomLore[Math.floor(Math.random()*randomLore.length)]);
                }
                else if(npc.id === 'herrero') {
                    if(p.questState === 2) { showDialogue(npc.name, "Necesito 5 maderas. Usa tu hacha en los árboles."); }
                    else if(p.questState === 3) { p.questState = 4; p.xp += 100; showDialogue(npc.name, "¡Excelente madera! Habla con el Guardia para enfrentarte al Rey Sombra."); }
                    else showDialogue(npc.name, "Tengo la mejor forja de la región.");
                }
                else if(npc.id === 'guardian') {
                    if(p.questState === 4) showDialogue(npc.name, "¡El Rey Sombra acecha en el este! Elimínalo.");
                    else if(p.questState === 5) { p.questState = 6; p.xp += 300; p.lvl += 2; showDialogue(npc.name, "¡Has salvado el reino! Eres una leyenda."); }
                    else showDialogue(npc.name, "Mantengo el valle a salvo.");
                }
                updateHUD();
            }
        });
    }

    function updateHUD() {
        document.getElementById('p-lvl').textContent = p.lvl;
        document.getElementById('p-xp').textContent = p.xp;
        document.getElementById('hp-bar').style.width = `${p.hp}%`;
        document.getElementById('mp-bar').style.width = `${(p.mp / p.maxMp)*100}%`;
        document.getElementById('wood-count').textContent = p.wood;

        const qText = document.getElementById('quest-text');
        if(p.questState === 0) qText.textContent = "Misión: Habla con el Sabio (?)";
        else if(p.questState === 1) qText.textContent = "Misión: Elimina a una Sombra";
        else if(p.questState === 2) qText.textContent = "Misión: Lleva 5 maderas al Herrero (?)";
        else if(p.questState === 3) qText.textContent = "¡Entrega la madera al Herrero (!)";
        else if(p.questState === 4) qText.textContent = "Misión: Derrota al Rey Sombra (Boss)";
        else if(p.questState === 5) qText.textContent = "¡Reporta la victoria al Guardia (!)";
        else qText.textContent = "¡Todas las Misiones Completadas!";
    }

    function bind(id, fn) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e)=>{ e.preventDefault(); fn(); });
        el.addEventListener('click', fn);
    }
    bind('btn-shoot', executeAttack);
    bind('btn-interact', interactNPC);

    function bindDir(id, k) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e)=>{e.preventDefault(); keys[k]=true;});
        el.addEventListener('touchend', (e)=>{e.preventDefault(); keys[k]=false;});
    }
    bindDir('btn-up','up'); bindDir('btn-down','down');
    bindDir('btn-left','left'); bindDir('btn-right','right');

    function drawMinimap() {
        minimapCtx.clearRect(0,0,90,90);
        const cx = 45, cy = 45, scale = 0.45;

        minimapCtx.fillStyle = '#064e3b';
        minimapCtx.fillRect(0,0,90,90);

        enemies.forEach(enemy => {
            let ex = (enemy.mesh.position.x - playerGroup.position.x) * scale;
            let ez = (enemy.mesh.position.z - playerGroup.position.z) * scale;
            
            if(Math.abs(ex) < 40 && Math.abs(ez) < 40) {
                minimapCtx.fillStyle = enemy.isBoss ? '#f59e0b' : '#ef4444';
                minimapCtx.beginPath();
                minimapCtx.arc(cx + ex, cy + ez, enemy.isBoss ? 4 : 2.5, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        });

        npcs.forEach(npc => {
            let nx = (npc.pos.x - playerGroup.position.x) * scale;
            let nz = (npc.pos.z - playerGroup.position.z) * scale;
            
            if(Math.abs(nx) < 40 && Math.abs(nz) < 40) {
                minimapCtx.font = 'bold 11px sans-serif';
                if((p.questState === 0 && npc.id==='sabio') || (p.questState === 2 && npc.id==='herrero') || (p.questState === 4 && npc.id==='guardian')) {
                    minimapCtx.fillStyle = '#3b82f6';
                    minimapCtx.fillText('?', cx + nx - 3, cy + nz + 4);
                } else if((p.questState === 3 && npc.id==='herrero') || (p.questState === 5 && npc.id==='guardian')) {
                    minimapCtx.fillStyle = '#f59e0b';
                    minimapCtx.fillText('!', cx + nx - 3, cy + nz + 4);
                } else {
                    minimapCtx.fillStyle = '#38bdf8';
                    minimapCtx.beginPath();
                    minimapCtx.arc(cx + nx, cy + nz, 2, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            }
        });

        minimapCtx.save();
        minimapCtx.translate(cx, cy);
        minimapCtx.rotate(-playerGroup.rotation.y);
        minimapCtx.fillStyle = '#ffffff';
        minimapCtx.beginPath();
        minimapCtx.moveTo(0, -4); minimapCtx.lineTo(3, 3); minimapCtx.lineTo(-3, 3);
        minimapCtx.closePath(); minimapCtx.fill();
        minimapCtx.restore();
    }

    function resize() {
        // Garantizar que la relación de aspecto siempre responda a Landscape (ancho > alto)
        let w = window.innerWidth;
        let h = window.innerHeight;
        
        if (h > w) {
            // Si el teléfono se mantiene verticalmente, invertimos dimensiones de renderizado para forzar aspecto horizontal
            camera.aspect = h / w;
        } else {
            camera.aspect = w / h;
        }

        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    function animate() {
        requestAnimationFrame(animate);

        if (keys.left) playerGroup.rotation.y += 0.04;
        if (keys.right) playerGroup.rotation.y -= 0.04;
        if (keys.up) playerGroup.translateZ(-p.speed);
        if (keys.down) playerGroup.translateZ(p.speed);

        if(p.mp < p.maxMp) {
            p.mp += 0.05;
            updateHUD();
        }

        projectiles.forEach((proj, prIndex) => {
            proj.mesh.position.addScaledVector(proj.dir, proj.speed);
            proj.life--;

            enemies.forEach((enemy, eIndex) => {
                if(proj.mesh.position.distanceTo(enemy.mesh.position) < 1.8) {
                    damageEnemy(enemy, eIndex, 45);
                    proj.life = 0;
                }
            });

            if(proj.life <= 0) {
                scene.remove(proj.mesh);
                projectiles.splice(prIndex, 1);
            }
        });

        vfxList.forEach((v, i) => {
            v.life--;
            if(v.life <= 0) {
                scene.remove(v.mesh);
                vfxList.splice(i, 1);
            }
        });

        const offset = new THREE.Vector3(0, 3.2, 5.5).applyMatrix4(playerGroup.matrixWorld);
        camera.position.lerp(offset, 0.1);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

        drawMinimap();
        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
