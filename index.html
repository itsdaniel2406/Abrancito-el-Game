<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Abrancito - El Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; color: white; }

        /* FORZAR PANTALLA HORIZONTAL EN MÓVILES PORTRAIT */
        #game-stage {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            overflow: hidden;
            background: #0b0f19;
        }

        @media screen and (orientation: portrait) {
            #game-stage {
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: top left;
                top: 0;
                left: 100vw;
            }
        }

        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* HUD SUPERIOR COMPACTO (NO TAPA EL MAPA) */
        #hud-top {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 10; pointer-events: none;
        }

        .hud-card {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            border: 1px solid #3b82f6; border-radius: 8px; padding: 6px 12px;
            pointer-events: auto; font-size: 11px;
        }

        .bar-bg { width: 100px; height: 8px; background: #020617; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        .bar-fill { height: 100%; background: #22c55e; width: 100%; }

        /* BOTÓN DE MENÚ LATERAL DESPLEGABLE */
        #menu-toggle {
            position: absolute; top: 10px; right: 10px; z-index: 20;
            background: #7c3aed; border: 1px solid #a855f7; border-radius: 6px;
            color: white; padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer;
        }

        /* DRAWER LATERAL OCULTO */
        #side-drawer {
            position: absolute; top: 0; right: -280px; width: 260px; height: 100%;
            background: rgba(15, 23, 42, 0.95); border-left: 2px solid #3b82f6;
            z-index: 15; padding: 15px; display: flex; flex-direction: column; gap: 10px;
            transition: right 0.3s ease;
        }

        #side-drawer.open { right: 0; }

        #chat-log {
            flex: 1; background: #020617; border: 1px solid #1e293b; border-radius: 6px;
            padding: 8px; font-size: 10px; overflow-y: auto;
        }

        /* CONTROLES MÓVILES (D-PAD Y BOTONES DE ACCIÓN) */
        #controls {
            position: absolute; bottom: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: flex-end;
            z-index: 10; pointer-events: none;
        }

        #dpad { width: 110px; height: 110px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 2px; pointer-events: auto; }
        .dp { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white; cursor: pointer; }

        #action-btns { display: flex; gap: 10px; pointer-events: auto; }
        .btn-act { width: 52px; height: 52px; border-radius: 50%; background: #1e293b; border: 2px solid #3b82f6; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="game-stage">
        <canvas id="gameCanvas"></canvas>

        <button id="menu-toggle" onclick="toggleDrawer()">📜 Menú / Chat</button>

        <!-- HUD SUPERIOR SLIM -->
        <div id="hud-top">
            <div class="hud-card">
                <div style="font-weight:bold; color:#38bdf8;">Abrancito (Nvl. 1)</div>
                <div class="bar-bg"><div id="hp-bar" class="bar-fill"></div></div>
                <div id="hp-text" style="font-size:9px; text-align:right;">100/100</div>
            </div>
            <div class="hud-card" style="margin-right: 110px;">
                <div style="color:#f59e0b; font-weight:bold;" id="map-name">Pradera Principal</div>
                <div id="quest-text" style="color:#cbd5e1; font-size:10px;">Habla con el Sabio Orestes</div>
            </div>
        </div>

        <!-- MENÚ LATERAL COMPLETO (DESPLEGABLE) -->
        <div id="side-drawer">
            <h3 style="color:#38bdf8; font-size:14px;">ABRANCITO - EL GAME</h3>
            <div style="font-size:11px; color:#94a3b8;">Clase: Guerrero</div>
            <hr style="border-color:#334155;">
            <div style="font-size:11px; color:#f59e0b; font-weight:bold;">Registro de Chat:</div>
            <div id="chat-log">
                <div><span style="color:#f59e0b;">Sistema:</span> Juego iniciado en pantalla completa.</div>
            </div>
            <button onclick="toggleDrawer()" style="padding:8px; background:#ef4444; border:none; color:white; border-radius:4px; cursor:pointer;">Cerrar Panel</button>
        </div>

        <!-- CONTROLES -->
        <div id="controls">
            <div id="dpad">
                <div></div><div class="dp" onclick="move(0,-1)">▲</div><div></div>
                <div class="dp" onclick="move(-1,0)">◀</div><div></div><div class="dp" onclick="move(1,0)">▶</div>
                <div></div><div class="dp" onclick="move(0,1)">▼</div><div></div>
            </div>

            <div id="action-btns">
                <div class="btn-act" style="background:#dc2626;" onclick="attack()" title="Atacar">⚔️</div>
                <div class="btn-act" style="background:#0284c7;" onclick="interact()" title="Hablar">💬</div>
            </div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        const stage = document.getElementById('game-stage');
        canvas.width = stage.clientWidth;
        canvas.height = stage.clientHeight;
    }
    window.addEventListener('resize', resize);
    setTimeout(resize, 100);

    const TILE_W = 64;
    const TILE_H = 32;
    const MAP_SIZE = 12;

    let p = { x: 5, y: 5, hp: 100, maxHp: 100, atk: 25, map: "Pradera Principal" };

    const mapData = {
        "Pradera Principal": {
            tile1: "#2d5a27", tile2: "#24491f",
            npc: { x: 2, y: 2, name: "Sabio Orestes" },
            enemy: { x: 8, y: 4, name: "Orco", hp: 60, maxHp: 60, alive: true }
        }
    };

    function toIso(x, y) {
        return {
            isoX: (canvas.width / 2) + (x - y) * (TILE_W / 2),
            isoY: 100 + (x + y) * (TILE_H / 2)
        };
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const m = mapData[p.map];

        for (let x = 0; x < MAP_SIZE; x++) {
            for (let y = 0; y < MAP_SIZE; y++) {
                const pt = toIso(x, y);
                ctx.beginPath();
                ctx.moveTo(pt.isoX, pt.isoY);
                ctx.lineTo(pt.isoX + TILE_W / 2, pt.isoY + TILE_H / 2);
                ctx.lineTo(pt.isoX, pt.isoY + TILE_H);
                ctx.lineTo(pt.isoX - TILE_W / 2, pt.isoY + TILE_H / 2);
                ctx.closePath();
                ctx.fillStyle = (x + y) % 2 === 0 ? m.tile1 : m.tile2;
                ctx.fill();
                ctx.strokeStyle = "rgba(0,0,0,0.2)";
                ctx.stroke();
            }
        }

        // DIBUJAR JUGADOR
        const ptP = toIso(p.x, p.y);
        ctx.fillStyle = '#15803d'; ctx.fillRect(ptP.isoX - 8, ptP.isoY - 20, 16, 16);
        ctx.fillStyle = '#ffdbac'; ctx.beginPath(); ctx.arc(ptP.isoX, ptP.isoY - 24, 6, 0, Math.PI*2); ctx.fill();

        // DIBUJAR NPC
        const ptN = toIso(m.npc.x, m.npc.y);
        ctx.fillStyle = '#0284c7'; ctx.fillRect(ptN.isoX - 8, ptN.isoY - 20, 16, 16);

        // DIBUJAR ENEMIGO
        if (m.enemy.alive) {
            const ptE = toIso(m.enemy.x, m.enemy.y);
            ctx.fillStyle = '#dc2626'; ctx.fillRect(ptE.isoX - 8, ptE.isoY - 20, 16, 16);
        }

        requestAnimationFrame(render);
    }

    function move(dx, dy) {
        if (p.x + dx >= 0 && p.x + dx < MAP_SIZE && p.y + dy >= 0 && p.y + dy < MAP_SIZE) {
            p.x += dx; p.y += dy;
        }
    }

    function attack() {
        const e = mapData[p.map].enemy;
        if (e.alive && Math.abs(e.x - p.x) <= 1 && Math.abs(e.y - p.y) <= 1) {
            e.hp -= p.atk;
            logChat(`Atacaste a ${e.name} (-${p.atk} HP)`);
            if (e.hp <= 0) e.alive = false;
        }
    }

    function interact() {
        const n = mapData[p.map].npc;
        if (Math.abs(n.x - p.x) <= 1 && Math.abs(n.y - p.y) <= 1) {
            logChat(`${n.name}: ¡Bienvenido Abrancito! Derrota al Orco.`);
        }
    }

    function toggleDrawer() {
        document.getElementById('side-drawer').classList.toggle('open');
    }

    function logChat(msg) {
        const log = document.getElementById('chat-log');
        log.innerHTML += `<div>${msg}</div>`;
        log.scrollTop = log.scrollHeight;
    }

    resize();
    render();
</script>
</body>
</html>
