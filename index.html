<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Abrahancito 3D - High Detail RPG</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; }

        #game-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; }

        #minimap-card {
            position: absolute; top: 12px; left: 12px;
            width: 90px; height: 90px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.6);
            overflow: hidden; z-index: 20;
        }
        #minimap { width: 100%; height: 100%; }

        #top-hud {
            position: absolute; top: 12px; left: 115px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 20;
        }

        #status-bar {
            background: rgba(15, 23, 42, 0.85); padding: 5px 10px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2); font-size: 10px; font-weight: bold;
        }
        .bar-wrap { width: 75px; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
        .hp-bar { width: 100%; height: 100%; background: #22c55e; }
        .mp-bar { width: 100%; height: 100%; background: #3b82f6; transition: width 0.2s; }

        #quest-hud {
            background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 12px;
            border: 1px solid #f59e0b; font-size: 10px; text-align: right; max-width: 200px;
        }

        #boss-bar-card {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 6px;
            border: 1px solid #ef4444; text-align: center; display: none; z-index: 20;
        }
        #boss-hp { width: 140px; height: 8px; background: #7f1d1d; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        #boss-hp-fill { width: 100%; height: 100%; background: #ef4444; }

        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(15, 23, 42, 0.85);
            padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); z-index: 30;
        }
        .slot {
            width: 42px; height: 42px; background: rgba(255,255,255,0.1);
            border: 2px solid #475569; border-radius: 6px; display: flex;
            align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer; position: relative;
        }
        .slot.active { border-color: #f59e0b; background: rgba(245, 158, 11, 0.3); }

        #dpad {
            position: absolute; left: 15px; bottom: 15px; width: 105px; height: 105px;
            display: grid; grid-template-columns: repeat(3, 35px); grid-template-rows: repeat(3, 35px);
            z-index: 30; gap: 1px;
        }
        .dp-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .dp-btn:active { background: rgba(255,255,255,0.5); }

        #action-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
        .act-btn {
            position: absolute; pointer-events: auto; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; touch-action: manipulation; backdrop-filter: blur(2px);
        }
        #btn-shoot { right: 20px; bottom: 20px; width: 58px; height: 58px; background: rgba(220, 38, 38, 0.5); border-color: #ef4444; }
        #btn-interact { right: 88px; bottom: 20px; width: 45px; height: 45px; background: rgba(14, 165, 233, 0.5); }

        #dialogue-box {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 450px; background: rgba(15, 23, 42, 0.95);
            border: 2px solid #f59e0b; border-radius: 8px; padding: 10px 14px;
            font-size: 12px; line-height: 1.4; display: none; z-index: 40;
        }

        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white; padding: 20px;
        }
        #start-btn {
            margin-top: 15px; padding: 12px 24px; background: #2563eb; color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
        }
    </style>
    <!-- Carga de Three.js y GLTFLoader para modelos 3D reales -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="fullscreen-overlay">
        <h2>🎮 Cargar Mundo Detallado</h2>
        <p style="margin-top: 8px; font-size: 14px; color: #94a3b8;">Toca para activar el renderizado de alta fidelidad.</p>
        <button id="start-btn">INICIAR JUEGO</button>
    </div>

    <div id="game-container">
        <div id="canvas-container"></div>

        <div id="minimap-card">
            <canvas id="minimap" width="90" height="90"></canvas>
        </div>

        <div id="boss-bar-card">
            <div style="font-size:10px; font-weight:bold; color:#ef4444;">👑 CABALLERO CARMESÍ (BOSS)</div>
            <div id="boss-hp"><div id="boss-hp-fill"></div></div>
        </div>

        <div id="top-hud">
            <div id="status-bar">
                <div>LVL <span id="p-lvl" style="color:#f59e0b">1</span> (<span id="p-xp">0</span>/100 XP)</div>
                <div style="margin-top:2px;">HP <div class="bar-wrap"><div id="hp-bar" class="hp-bar"></div></div></div>
                <div style="margin-top:2px;">MP <div class="bar-wrap"><div id="mp-bar" class="mp-bar"></div></div></div>
            </div>
            <div id="quest-hud">
                <span id="quest-text" style="color:#fde047;">Misión: Explora el reino</span>
            </div>
        </div>

        <div id="dialogue-box">
            <div id="dialogue-speaker" style="color:#f59e0b; font-weight:bold; margin-bottom:3px;">NPC</div>
            <div id="dialogue-text">...</div>
        </div>

        <div id="hotbar">
            <div class="slot active" id="slot-0" onclick="selectSlot(0)">🗡️</div>
            <div class="slot" id="slot-1" onclick="selectSlot(1)">🪓</div>
            <div class="slot" id="slot-2" onclick="selectSlot(2)">🔮</div>
        </div>

        <div id="dpad">
            <div></div><div class="dp-btn" id="btn-up">▲</div><div></div>
            <div class="dp-btn" id="btn-left">◀</div><div></div><div class="dp-btn" id="btn-right">▶</div>
            <div></div><div class="dp-btn" id="btn-down">▼</div><div></div>
        </div>

        <div id="action-layer">
            <div class="act-btn" id="btn-shoot">🎯</div>
            <div class="act-btn" id="btn-interact">💬</div>
        </div>
    </div>

<script>
    document.getElementById('start-btn').addEventListener('click', async () => {
        try {
            if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        } catch (e) {}
        document.getElementById('fullscreen-overlay').style.display = 'none';
        resize();
    });

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    // Renderizador con sombras suaves y mapeo de color cinemático
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const minimapCtx = document.getElementById('minimap').getContext('2d');

    // Iluminación cinemática
    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.6);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffedd5, 1.5);
    sun.position.set(30, 50, 20);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    const loader = new THREE.GLTFLoader();

    // Contenedor principal del Jugador
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    // --- CARGA DE MODELOS 3D / FALLBACK CON SUAVIZADO Y SOMBREAJE CÁLIDO ---
    function buildDetailedCharacter() {
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.3, metalness: 0.2 });
        const armorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.2, metalness: 0.8 });
        
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.25, 1.2, 16), bodyMat);
        body.position.y = 0.9;
        body.castShadow = true;
        playerGroup.add(body);

        const shoulders = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 12), armorMat);
        shoulders.scale.set(1.8, 0.6, 0.8);
        shoulders.position.set(0, 1.3, 0);
        playerGroup.add(shoulders);

        // Aura resplandeciente alrededor del jugador
        const aura = new THREE.PointLight(0x38bdf8, 1, 4);
        aura.position.set(0, 1.2, 0);
        playerGroup.add(aura);
    }
    buildDetailedCharacter();

    // Terreno con acabado mate y suave
    const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(300, 300),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    let p = { lvl: 1, xp: 0, hp: 100, mp: 80, maxMp: 80, activeSlot: 0 };
    const keys = { up: false, down: false, left: false, right: false };

    // Partículas de efectos (Aura / Hechizos)
    const particles = [];
    function createMagicParticles(pos, colorHex) {
        for(let i=0; i<8; i++) {
            const pMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 6, 6),
                new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 })
            );
            pMesh.position.copy(pos);
            scene.add(pMesh);
            particles.push({
                mesh: pMesh,
                vel: new THREE.Vector3((Math.random()-0.5)*0.1, Math.random()*0.08, (Math.random()-0.5)*0.1),
                life: 20
            });
        }
    }

    function selectSlot(i) {
        p.activeSlot = i;
        document.querySelectorAll('.slot').forEach((s, idx) => s.classList.toggle('active', idx === i));
    }

    function executeAttack() {
        createMagicParticles(playerGroup.position.clone().add(new THREE.Vector3(0, 1, -1)), 0x38bdf8);
    }

    function bind(id, fn) {
        const el = document.getElementById(id);
        el.addEventListener('click', fn);
        el.addEventListener('touchstart', (e)=>{ e.preventDefault(); fn(); });
    }
    bind('btn-shoot', executeAttack);

    function bindDir(id, k) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e)=>{e.preventDefault(); keys[k]=true;});
        el.addEventListener('touchend', (e)=>{e.preventDefault(); keys[k]=false;});
    }
    bindDir('btn-up','up'); bindDir('btn-down','down');
    bindDir('btn-left','left'); bindDir('btn-right','right');

    function resize() {
        let w = window.innerWidth, h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }
    window.addEventListener('resize', resize);

    function animate() {
        requestAnimationFrame(animate);

        if (keys.left) playerGroup.rotation.y += 0.04;
        if (keys.right) playerGroup.rotation.y -= 0.04;
        if (keys.up) playerGroup.translateZ(-0.18);
        if (keys.down) playerGroup.translateZ(0.18);

        // Actualizar partículas
        particles.forEach((pt, index) => {
            pt.mesh.position.add(pt.vel);
            pt.life--;
            if(pt.life <= 0) {
                scene.remove(pt.mesh);
                particles.splice(index, 1);
            }
        });

        const offset = new THREE.Vector3(0, 3.5, 6).applyMatrix4(playerGroup.matrixWorld);
        camera.position.lerp(offset, 0.1);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
