<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abrancito - El Game</title>
    <style>
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background-color: #0b0f19; color: white; }

        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background: #111827; box-shadow: 0 0 50px rgba(0,0,0,0.8); }

        /* HUD - Chat & Misión */
        #dofus-chat {
            position: absolute; top: 12px; left: 12px; width: 280px; height: 140px;
            background: rgba(15, 23, 42, 0.9); border: 2px solid #3b82f6; border-radius: 8px;
            padding: 8px; font-size: 11px; overflow-y: auto; pointer-events: auto; z-index: 20;
        }
        .chat-msg { margin-bottom: 4px; color: #e2e8f0; }
        .chat-speaker { color: #f59e0b; font-weight: bold; }

        #quest-banner {
            position: absolute; top: 12px; right: 12px;
            background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
            border: 2px solid #60a5fa; border-radius: 8px; padding: 8px 16px;
            font-size: 12px; font-weight: bold; z-index: 20;
        }

        /* Inventory & Equipment */
        #inventory-window {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 360px; background: #1e293b; border: 3px solid #3b82f6; border-radius: 12px;
            padding: 14px; display: none; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .inv-title { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #475569; padding-bottom: 8px; margin-bottom: 12px; }
        .equipment-slots { display: flex; justify-content: space-around; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
        .eq-slot { width: 54px; height: 54px; background: #1e293b; border: 2px dashed #475569; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .eq-slot.equipped { border: 2px solid #22c55e; background: rgba(34, 197, 94, 0.15); }
        .inv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-height: 150px; overflow-y: auto; }
        .inv-cell { width: 52px; height: 52px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .inv-cell:hover { border-color: #f59e0b; }

        /* Action Bar */
        #action-bar {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(15, 23, 42, 0.95); border: 2px solid #3b82f6;
            border-radius: 10px; padding: 8px 16px; z-index: 20;
        }
        .act-btn { width: 48px; height: 48px; background: #1e293b; border: 1px solid #475569; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; }
        .act-btn:active { transform: scale(0.92); }

        /* D-Pad */
        #dpad { position: absolute; left: 15px; bottom: 15px; width: 110px; height: 110px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); z-index: 25; gap: 2px; }
        .dp-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="960" height="640"></canvas>

        <div id="dofus-chat">
            <div class="chat-msg"><span class="chat-speaker">Sistema:</span> Motor Isométrico HD Listo.</div>
            <div id="dynamic-chat"></div>
        </div>

        <div id="quest-banner">
            <span id="quest-text">Misión: Habla con el Sabio Orestes</span>
        </div>

        <!-- Inventario -->
        <div id="inventory-window">
            <div class="inv-title">
                <span style="color:#f59e0b; font-weight:bold;">🎒 Equipo y Objetos</span>
                <span style="cursor:pointer; color:#ef4444; font-weight:bold;" onclick="toggleInventory()">✖</span>
            </div>
            <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">EQUIPAMIENTO:</div>
            <div class="equipment-slots">
                <div class="eq-slot" id="eq-weapon" onclick="unequipSlot('weapon')" title="Arma">🗡️</div>
                <div class="eq-slot" id="eq-shield" onclick="unequipSlot('shield')" title="Escudo">🛡️</div>
                <div class="eq-slot" id="eq-boots" onclick="unequipSlot('boots')" title="Zapatos">👢</div>
                <div class="eq-slot" id="eq-ring" onclick="unequipSlot('ring')" title="Anillo">💍</div>
            </div>
            <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">INVENTARIO:</div>
            <div class="inv-grid" id="inv-grid"></div>
        </div>

        <!-- Acciones -->
        <div id="action-bar">
            <div class="act-btn" onclick="executeAttack()" style="background:#dc2626; border-color:#ef4444;">⚔️</div>
            <div class="act-btn" onclick="interactNPC()" style="background:#0284c7; border-color:#38bdf8;">💬</div>
            <div class="act-btn" onclick="toggleInventory()" style="background:#7c3aed; border-color:#a78bfa;">🎒</div>
        </div>

        <!-- D-PAD Mobile -->
        <div id="dpad">
            <div></div><div class="dp-btn" id="btn-up">▲</div><div></div>
            <div class="dp-btn" id="btn-left">◀</div><div></div><div class="dp-btn" id="btn-right">▶</div>
            <div></div><div class="dp-btn" id="btn-down">▼</div><div></div>
        </div>
    </div>

<script>
    // --- CANVAS Y MOTOR ISOMÉTRICO 2D ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const MAP_SIZE = 14; // Grilla Isométrica 14x14
    const TILE_WIDTH = 64;
    const TILE_HEIGHT = 32;
    const ORIGIN_X = canvas.width / 2;
    const ORIGIN_Y = 120;

    // --- ESTADO DEL JUGADOR CON PERSISTENCIA ---
    let p = JSON.parse(localStorage.getItem('dofus_hd_save')) || {
        gridX: 6, gridY: 6,
        lvl: 1, xp: 0, hp: 100, maxHp: 100, wood: 0,
        baseAtk: 15, questState: 0,
        equipment: { weapon: null, shield: null, boots: null, ring: null },
        inventory: [
            { id: 1, name: 'Hacha de Madera', icon: '🪓', type: 'weapon', bonus: 5 },
            { id: 2, name: 'Botas de Cuero', icon: '👢', type: 'boots', bonus: 8 }
        ]
    };

    function saveProgress() {
        localStorage.setItem('dofus_hd_save', JSON.stringify(p));
    }

    // Transformación Isométrica exacta
    function toIso(x, y) {
        return {
            isoX: ORIGIN_X + (x - y) * (TILE_WIDTH / 2),
            isoY: ORIGIN_Y + (x + y) * (TILE_HEIGHT / 2)
        };
    }

    // --- OBJETOS DEL MUNDO ---
    const npc = { gridX: 3, gridY: 3, name: "Sabio Orestes" };

    const enemies = [
        { id: 1, gridX: 9, gridY: 4, name: "Jalató Real", hp: 40, maxHp: 40, alive: true },
        { id: 2, gridX: 4, gridY: 10, name: "Jalató Silvestre", hp: 40, maxHp: 40, alive: true },
        { id: 3, gridX: 11, gridY: 11, name: "Jalató Negro", hp: 50, maxHp: 50, alive: true }
    ];

    const trees = [
        { gridX: 2, gridY: 8, hp: 3 },
        { gridX: 8, gridY: 2, hp: 3 },
        { gridX: 10, gridY: 7, hp: 3 }
    ];

    const possibleLoot = [
        { name: 'Espada de Cristal', icon: '🗡️', type: 'weapon', bonus: 20 },
        { name: 'Escudo de Roble', icon: '🛡️', type: 'shield', bonus: 15 },
        { name: 'Botas Acorazadas', icon: '👢', type: 'boots', bonus: 12 },
        { name: 'Anillo Magia', icon: '💍', type: 'ring', bonus: 10 }
    ];

    // --- DIBUJO DE GRÁFICOS ILUSTRADOS EN CANVAS ---
    function drawTile(x, y, color, strokeColor) {
        const pt = toIso(x, y);
        ctx.beginPath();
        ctx.moveTo(pt.isoX, pt.isoY);
        ctx.lineTo(pt.isoX + TILE_WIDTH / 2, pt.isoY + TILE_HEIGHT / 2);
        ctx.lineTo(pt.isoX, pt.isoY + TILE_HEIGHT);
        ctx.lineTo(pt.isoX - TILE_WIDTH / 2, pt.isoY + TILE_HEIGHT / 2);
        ctx.closePath();

        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = strokeColor || '#334155';
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    function drawShadow(x, y, radius) {
        const pt = toIso(x, y);
        ctx.beginPath();
        ctx.ellipse(pt.isoX, pt.isoY + TILE_HEIGHT / 2, radius, radius / 2, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();
    }

    function drawTree(x, y) {
        drawShadow(x, y, 22);
        const pt = toIso(x, y);

        // Tronco con corteza detallada
        ctx.fillStyle = '#5c3a21';
        ctx.fillRect(pt.isoX - 6, pt.isoY - 30, 12, 35);

        // Copa en gradiente orgánico
        const grad = ctx.createRadialGradient(pt.isoX, pt.isoY - 50, 5, pt.isoX, pt.isoY - 50, 30);
        grad.addColorStop(0, '#4ade80');
        grad.addColorStop(1, '#15803d');

        ctx.beginPath();
        ctx.arc(pt.isoX, pt.isoY - 50, 26, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#166534';
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    function drawCharacter(x, y, label, bodyColor, hatIcon) {
        drawShadow(x, y, 16);
        const pt = toIso(x, y);

        // Cuerpo
        ctx.beginPath();
        ctx.arc(pt.isoX, pt.isoY - 18, 14, 0, Math.PI * 2);
        ctx.fillStyle = bodyColor;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Icono / Sombrero
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(hatIcon, pt.isoX, pt.isoY - 36);

        // Etiqueta de Nombre
        ctx.font = 'bold 11px sans-serif';
        ctx.fillStyle = '#f8fafc';
        ctx.fillText(label, pt.isoX, pt.isoY - 50);
    }

    function drawJalato(enemy) {
        if (!enemy.alive) return;
        drawShadow(enemy.gridX, enemy.gridY, 18);
        const pt = toIso(enemy.gridX, enemy.gridY);

        // Cuerpo Peludo Jalató
        ctx.beginPath();
        ctx.arc(pt.isoX, pt.isoY - 12, 16, 0, Math.PI * 2);
        ctx.fillStyle = '#f1f5f9';
        ctx.fill();
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();

        // Ojos y Cuernos
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(pt.isoX - 6, pt.isoY - 16, 3, 3);
        ctx.fillRect(pt.isoX + 3, pt.isoY - 16, 3, 3);

        ctx.font = '12px sans-serif';
        ctx.fillText('🐏', pt.isoX - 8, pt.isoY - 22);

        // Barra de Vida
        const hpPercent = enemy.hp / enemy.maxHp;
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(pt.isoX - 16, pt.isoY - 36, 32, 4);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(pt.isoX - 16, pt.isoY - 36, 32 * hpPercent, 4);
    }

    // --- BUCLE PRINCIPAL DE RENDERIZADO ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. DIBUJAR TERRENO ISOMÉTRICO Y BORDES DEL MAPA
        for (let x = 0; x < MAP_SIZE; x++) {
            for (let y = 0; y < MAP_SIZE; y++) {
                const isBorder = x === 0 || y === 0 || x === MAP_SIZE - 1 || y === MAP_SIZE - 1;
                const tileColor = isBorder ? '#334155' : ((x + y) % 2 === 0 ? '#4fa32d' : '#459225');
                drawTile(x, y, tileColor, isBorder ? '#1e293b' : '#3d8220');
            }
        }

        // 2. DIBUJAR OBJETOS Y ELEMENTOS
        trees.forEach(t => drawTree(t.gridX, t.gridY));
        drawCharacter(npc.gridX, npc.gridY, npc.name, '#0284c7', '🧙‍♂️');
        enemies.forEach(e => drawJalato(e));
        drawCharacter(p.gridX, p.gridY, "Héroe", '#ea580c', '🥷');

        requestAnimationFrame(render);
    }

    // --- MOVIMIENTO CON LÍMITES STRICTOS DE MAPA ---
    function movePlayer(dx, dy) {
        const nextX = p.gridX + dx;
        const nextY = p.gridY + dy;

        // Borde infranqueable (Pared Invisible)
        if (nextX >= 1 && nextX < MAP_SIZE - 1 && nextY >= 1 && nextY < MAP_SIZE - 1) {
            p.gridX = nextX;
            p.gridY = nextY;
            saveProgress();
        } else {
            addChatMsg("Sistema", "¡Alcanzaste el límite del mapa!");
        }
    }

    // --- SISTEMA DE COMBATE Y DROPS ---
    function executeAttack() {
        let totalAtk = p.baseAtk;
        Object.values(p.equipment).forEach(item => { if(item) totalAtk += item.bonus; });

        let attacked = false;
        enemies.forEach(e => {
            if (e.alive && Math.abs(e.gridX - p.gridX) <= 1 && Math.abs(e.gridY - p.gridY) <= 1) {
                e.hp -= totalAtk;
                attacked = true;
                addChatMsg("Combate", `Atacaste a ${e.name} por ${totalAtk} de daño.`);

                if (e.hp <= 0) {
                    e.alive = false;
                    addChatMsg("Victoria", `¡Eliminaste a ${e.name}! (+35 XP)`);
                    p.xp += 35;

                    const drop = possibleLoot[Math.floor(Math.random() * possibleLoot.length)];
                    p.inventory.push(drop);
                    addChatMsg("Botín", `Conseguiste: ${drop.name}`);
                    saveProgress();

                    // RESPAWN AUTOMÁTICO EN 4 SEGUNDOS
                    setTimeout(() => {
                        e.hp = e.maxHp;
                        e.alive = true;
                        addChatMsg("Sistema", `${e.name} reapareció en el mapa.`);
                    }, 4000);
                }
            }
        });

        // Tala de madera
        if (!attacked && p.equipment.weapon && p.equipment.weapon.icon === '🪓') {
            trees.forEach((t, idx) => {
                if (Math.abs(t.gridX - p.gridX) <= 1 && Math.abs(t.gridY - p.gridY) <= 1) {
                    t.hp--;
                    if (t.hp <= 0) {
                        trees.splice(idx, 1);
                        p.wood += 3;
                        addChatMsg("Recolección", "¡+3 de Madera recolectada!");
                        saveProgress();
                    }
                }
            });
        }
    }

    // --- NPC Y MISIÓN ---
    function interactNPC() {
        if (Math.abs(npc.gridX - p.gridX) <= 1 && Math.abs(npc.gridY - p.gridY) <= 1) {
            if (p.questState === 0) {
                addChatMsg("Orestes", "¡Hola aventurero! Derrota a un Jalató para iniciar tu entrenamiento.");
                p.questState = 1;
            } else {
                addChatMsg("Orestes", "Sigue derrotando criaturas y equipando tus objetos mejores en el inventario.");
            }
            saveProgress();
            document.getElementById('quest-text').textContent = "Misión: Elimina los Jalatós";
        }
    }

    // --- GESTIÓN DE INVENTARIO Y EQUIPO ---
    function toggleInventory() {
        const inv = document.getElementById('inventory-window');
        inv.style.display = inv.style.display === 'block' ? 'none' : 'block';
        renderInventoryUI();
    }

    function renderInventoryUI() {
        const grid = document.getElementById('inv-grid');
        grid.innerHTML = '';

        p.inventory.forEach((item, idx) => {
            const cell = document.createElement('div');
            cell.className = 'inv-cell';
            cell.innerHTML = `<div>${item.icon}</div><div style="font-size:9px; color:#f59e0b;">+${item.bonus}</div>`;
            cell.onclick = () => equipItem(idx);
            grid.appendChild(cell);
        });

        ['weapon', 'shield', 'boots', 'ring'].forEach(slot => {
            const el = document.getElementById(`eq-${slot}`);
            const eqItem = p.equipment[slot];
            if (eqItem) {
                el.innerHTML = eqItem.icon;
                el.classList.add('equipped');
            } else {
                const icons = { weapon: '🗡️', shield: '🛡️', boots: '👢', ring: '💍' };
                el.innerHTML = icons[slot];
                el.classList.remove('equipped');
            }
        });
    }

    function equipItem(index) {
        const item = p.inventory[index];
        if (!item) return;

        if (p.equipment[item.type]) {
            p.inventory.push(p.equipment[item.type]);
        }

        p.equipment[item.type] = item;
        p.inventory.splice(index, 1);
        addChatMsg("Equipo", `Te equipaste: ${item.name}`);
        saveProgress();
        renderInventoryUI();
    }

    function unequipSlot(type) {
        if (p.equipment[type]) {
            p.inventory.push(p.equipment[type]);
            addChatMsg("Equipo", `Te quitaste: ${p.equipment[type].name}`);
            p.equipment[type] = null;
            saveProgress();
            renderInventoryUI();
        }
    }

    function addChatMsg(speaker, text) {
        const chat = document.getElementById('dynamic-chat');
        const msg = document.createElement('div');
        msg.className = 'chat-msg';
        msg.innerHTML = `<span class="chat-speaker">${speaker}:</span> ${text}`;
        chat.appendChild(msg);
        chat.scrollTop = chat.scrollHeight;
    }

    // --- CONTROLES ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
        if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
        if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
        if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
    });

    function bindBtn(id, dx, dy) {
        document.getElementById(id).addEventListener('click', () => movePlayer(dx, dy));
    }
    bindBtn('btn-up', 0, -1); bindBtn('btn-down', 0, 1);
    bindBtn('btn-left', -1, 0); bindBtn('btn-right', 1, 0);

    render();
</script>
</body>
</html>
