<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrahancito</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 5px; color: #f1c40f; }

        #game-container {
            position: relative;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            background-color: #27ae60; /* Pasto */
            display: block;
        }

        /* Cuadro de Diálogo estilo RPG */
        #dialog-box {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #fff;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            display: none;
            color: #fff;
        }

        .controls-info {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
            text-align: center;
        }

        .btn-panel {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        button {
            background: #2980b9;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        button:hover { background: #3498db; }
        button.reset { background: #c0392b; }
        button.reset:hover { background: #e74c3c; }
    </style>
</head>
<body>

    <h1>Abrahancito: La Leyenda</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div id="dialog-box">
            <strong id="npc-name" style="color: #f39c12;"></strong>
            <p id="npc-text" style="margin: 5px 0 0 0;"></p>
        </div>
    </div>

    <div class="controls-info">
        Moverse: <b>Flechas / WASD</b> | Hablar: <b>E</b> (cerca de un NPC)
    </div>

    <div class="btn-panel">
        <button onclick="saveGame()">Guardar Partida 💾</button>
        <button class="reset" onclick="resetGame()">Reiniciar Partida 🔄</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const dialogBox = document.getElementById('dialog-box');
    const npcNameEl = document.getElementById('npc-name');
    const npcTextEl = document.getElementById('npc-text');

    // Estado del Jugador (Abrahancito)
    let player = {
        x: 100,
        y: 100,
        size: 24,
        speed: 3,
        color: '#3498db'
    };

    // Estado de las Teclas
    const keys = {};

    // Lista de NPCs en el mapa
    const npcs = [
        {
            name: "Anciano sabio",
            x: 250,
            y: 150,
            size: 24,
            color: '#e67e22',
            dialog: "¡Hola Abrahancito! Si quieres salvar la aldea, guarda tu progreso seguido."
        },
        {
            name: "Guardia Real",
            x: 450,
            y: 280,
            size: 24,
            color: '#9b59b6',
            dialog: "El camino del norte es peligroso. Ten cuidado."
        }
    ];

    let currentNPC = null;

    // Escuchar Teclado
    window.addEventListener('keydown', e => {
        keys[e.key.toLowerCase()] = true;
        if (e.key.toLowerCase() === 'e') {
            interactNPC();
        }
    });

    window.addEventListener('keyup', e => {
        keys[e.key.toLowerCase()] = false;
    });

    // Mover Jugador
    function updatePlayer() {
        let moving = false;
        if (keys['arrowup'] || keys['w']) { player.y -= player.speed; moving = true; }
        if (keys['arrowdown'] || keys['s']) { player.y += player.speed; moving = true; }
        if (keys['arrowleft'] || keys['a']) { player.x -= player.speed; moving = true; }
        if (keys['arrowright'] || keys['d']) { player.x += player.speed; moving = true; }

        // Colisiones con bordes del mapa
        player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
        player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));

        // Comprobar cercanía a NPCs para mostrar indicador
        checkNPCDistance();
    }

    // Comprobar distancia a NPCs
    function checkNPCDistance() {
        currentNPC = null;
        for (let npc of npcs) {
            // Distancia Euclidiana simple
            let dx = (player.x + player.size/2) - (npc.x + npc.size/2);
            let dy = (player.y + player.size/2) - (npc.y + npc.size/2);
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 45) {
                currentNPC = npc;
                break;
            }
        }

        if (!currentNPC) {
            dialogBox.style.display = 'none';
        }
    }

    // Sistema de Diálogo
    function interactNPC() {
        if (currentNPC) {
            npcNameEl.textContent = currentNPC.name;
            npcTextEl.textContent = currentNPC.dialog;
            dialogBox.style.display = 'block';
        }
    }

    // Dibujar elementos en pantalla
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar NPCs
        npcs.forEach(npc => {
            ctx.fillStyle = npc.color;
            ctx.fillRect(npc.x, npc.y, npc.size, npc.size);
            
            // Etiqueta indicadora
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.fillText(npc.name, npc.x - 10, npc.y - 5);
        });

        // Dibujar Jugador (Abrahancito)
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.size, player.size);
        
        // Gorrito/Insignia para identificarlo
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(player.x + 6, player.y + 2, 12, 6);
    }

    // Bucle Principal del Juego
    function gameLoop() {
        updatePlayer();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- SISTEMA DE GUARDADO ---
    function saveGame() {
        const saveData = {
            playerX: player.x,
            playerY: player.y
        };
        localStorage.setItem('abrahancito_save', JSON.stringify(saveData));
        alert('¡Partida guardada con éxito!');
    }

    function loadGame() {
        const savedData = localStorage.getItem('abrahancito_save');
        if (savedData) {
            const data = JSON.parse(savedData);
            player.x = data.playerX;
            player.y = data.playerY;
        }
    }

    function resetGame() {
        localStorage.removeItem('abrahancito_save');
        player.x = 100;
        player.y = 100;
        dialogBox.style.display = 'none';
        alert('Progreso reiniciado.');
    }

    // Cargar partida e Iniciar
    loadGame();
    gameLoop();
</script>

</body>
</html>
