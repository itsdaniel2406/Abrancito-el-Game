<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Abrahancito: Mundo Abierto 3D - v1</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* HUD Interfaz */
        .hud {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.85);
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid #334155;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
        }

        .bar-container {
            width: 120px;
            height: 12px;
            background: #334155;
            border-radius: 6px;
            overflow: hidden;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }

        .hp-bar { width: 100%; height: 100%; background: #ef4444; transition: width 0.2s; }

        /* Cuadro de Diálogo */
        #dialog-box {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 15px;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            z-index: 10;
        }

        /* Controles Táctiles estilo GTA */
        #touch-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
            pointer-events: none;
        }

        .dpad, .action-btns {
            pointer-events: auto;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(3, 50px);
            gap: 4px;
        }

        .dbtn {
            background: rgba(31, 41, 55, 0.8);
            border: 2px solid #4b5563;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        .dbtn:active { background: #6b7280; }

        .action-btns {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .abtn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid #fff;
            color: white;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .btn-a { background: #dc2626; }
        .btn-b { background: #2563eb; }
        .abtn:active { transform: scale(0.9); }

        .credits {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 12px;
            color: #9ca3af;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
    <!-- Carga de Three.js para motor de gráficos 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud">
        <div>SALUD: <div class="bar-container"><div id="hp-bar" class="hp-bar"></div></div></div>
        <div style="margin-top: 5px; color: #f59e0b;">MUNDO: <span id="zone-txt">Ciudad Central 3D</span></div>
    </div>

    <div class="credits">Creado por Dani v1</div>

    <div id="dialog-box">
        <strong id="npc-name" style="color: #f59e0b; font-size: 16px;"></strong>
        <p id="npc-text" style="margin: 6px 0 0 0; font-size: 14px; line-height: 1.4;"></p>
    </div>

    <div id="touch-controls">
        <div class="dpad">
            <div></div><div class="dbtn" id="btn-up">▲</div><div></div>
            <div class="dbtn" id="btn-left">◀</div><div></div><div class="dbtn" id="btn-right">▶</div>
            <div></div><div class="dbtn" id="btn-down">▼</div><div></div>
        </div>
        <div class="action-btns">
            <div class="abtn btn-b" id="btn-action">HABLAR</div>
            <div class="abtn btn-a" id="btn-attack">GOLPE</div>
        </div>
    </div>

<script>
    // --- MOTOR Y ESCENA 3D ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb); // Cielo azul estilo San Andreas
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(50, 80, 50);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- ESTADO DEL JUEGO ---
    let playerState = {
        hp: 100, maxHp: 100,
        speed: 0.15,
        rotSpeed: 0.04
    };

    const keys = { up: false, down: false, left: false, right: false };

    // --- CONSTRUCCIÓN DEL MUNDO ABIERTO (CIUDAD Y CALLES) ---
    // Suelo / Calles
    const floorGeo = new THREE.PlaneGeometry(200, 200);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Bloques de Pasto / Parques
    const parkGeo = new THREE.BoxGeometry(40, 0.2, 40);
    const parkMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32 });
    const park = new THREE.Mesh(parkGeo, parkMat);
    park.position.set(-30, 0.1, -30);
    scene.add(park);

    // Edificios
    function createBuilding(x, z, w, h, d, color) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshStandardMaterial({ color: color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, h/2, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
    }

    createBuilding(30, 30, 20, 40, 20, 0x94a3b8);
    createBuilding(-30, 30, 25, 30, 15, 0x64748b);
    createBuilding(40, -30, 18, 50, 18, 0x475569);

    // --- PERSONAJE PRINCIPAL (ABRAHANCITO 3D) ---
    const playerGroup = new THREE.Group();

    // Cuerpo
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.4, 8);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2563eb });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.7;
    playerGroup.add(body);

    // Cabeza
    const headGeo = new THREE.SphereGeometry(0.4, 8, 8);
    const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.6;
    playerGroup.add(head);

    // Sombrero estilo Vaquero / Heroico
    const hatGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.1, 8);
    const hatMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b });
    const hat = new THREE.Mesh(hatGeo, hatMat);
    hat.position.y = 1.9;
    playerGroup.add(hat);

    playerGroup.position.set(0, 0, 0);
    scene.add(playerGroup);

    // --- ENEMIGOS Y NPCS 3D ---
    // NPCs
    const npcs = [];
    function createNPC(x, z, name, dialog, color) {
        const group = new THREE.Group();
        const mGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.4, 8);
        const mMat = new THREE.MeshStandardMaterial({ color: color });
        const mesh = new THREE.Mesh(mGeo, mMat);
        mesh.position.y = 0.7;
        group.add(mesh);

        group.position.set(x, 0, z);
        scene.add(group);
        npcs.push({ group, name, dialog });
    }

    createNPC(5, -5, "Ciudadano", "¡Bienvenido a la ciudad 3D Abrahancito! Puedes explorar libremente.", 0x10b981);
    createNPC(-15, -20, "Mecánico", "Hay villanos cerca de los edificios, pero no hacen mucho daño.", 0xf59e0b);

    // ENEMIGOS (Dificultad Baja)
    const enemies = [];
    function createEnemy(x, z) {
        const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        const mat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, 0.6, z);
        mesh.castShadow = true;
        scene.add(mesh);
        enemies.push({ mesh, hp: 30, speed: 0.03 }); // Velocidad lenta para bajar dificultad
    }

    createEnemy(20, 15);
    createEnemy(-20, 20);

    // --- CONTROLES Y EVENTOS ---
    window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (k === 'w' || k === 'arrowup') keys.up = true;
        if (k === 's' || k === 'arrowdown') keys.down = true;
        if (k === 'a' || k === 'arrowleft') keys.left = true;
        if (k === 'd' || k === 'arrowright') keys.right = true;
        if (k === 'e') interact();
        if (k === ' ') attack();
    });

    window.addEventListener('keyup', e => {
        const k = e.key.toLowerCase();
        if (k === 'w' || k === 'arrowup') keys.up = false;
        if (k === 's' || k === 'arrowdown') keys.down = false;
        if (k === 'a' || k === 'arrowleft') keys.left = false;
        if (k === 'd' || k === 'arrowright') keys.right = false;
    });

    function bindTouch(id, keyName) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
        el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
        el.addEventListener('mousedown', () => { keys[keyName] = true; });
        el.addEventListener('mouseup', () => { keys[keyName] = false; });
    }

    bindTouch('btn-up', 'up'); bindTouch('btn-down', 'down');
    bindTouch('btn-left', 'left'); bindTouch('btn-right', 'right');

    document.getElementById('btn-attack').addEventListener('click', attack);
    document.getElementById('btn-action').addEventListener('click', interact);

    // --- BUCLE Y LÓGICA DE JUEGO ---
    function update() {
        // Movimiento de Abrahancito
        if (keys.left) playerGroup.rotation.y += playerState.rotSpeed;
        if (keys.right) playerGroup.rotation.y -= playerState.rotSpeed;

        if (keys.up) {
            playerGroup.translateZ(-playerState.speed);
        }
        if (keys.down) {
            playerGroup.translateZ(playerState.speed);
        }

        // Cámara en 3ra Persona estilo GTA
        const cameraOffset = new THREE.Vector3(0, 4, 8).applyMatrix4(playerGroup.matrixWorld);
        camera.position.lerp(cameraOffset, 0.1);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

        // Movimiento Lento de Enemigos (Baja Dificultad)
        enemies.forEach((enemy, i) => {
            const dist = enemy.mesh.position.distanceTo(playerGroup.position);
            if (dist < 12 && dist > 1.2) {
                enemy.mesh.lookAt(playerGroup.position);
                enemy.mesh.translateZ(enemy.speed);
            } else if (dist <= 1.2) {
                // Daño bajo al jugador
                playerState.hp = Math.max(0, playerState.hp - 0.1);
                document.getElementById('hp-bar').style.width = `${playerState.hp}%`;
            }
        });
    }

    function attack() {
        enemies.forEach((enemy, i) => {
            const dist = enemy.mesh.position.distanceTo(playerGroup.position);
            if (dist < 3) {
                enemy.hp -= 15;
                enemy.mesh.position.x += Math.sin(playerGroup.rotation.y) * -1;
                enemy.mesh.position.z += Math.cos(playerGroup.rotation.y) * -1;

                if (enemy.hp <= 0) {
                    scene.remove(enemy.mesh);
                    enemies.splice(i, 1);
                }
            }
        });
    }

    function interact() {
        const dialogBox = document.getElementById('dialog-box');
        if (dialogBox.style.display === 'block') {
            dialogBox.style.display = 'none';
            return;
        }

        npcs.forEach(npc => {
            const dist = npc.group.position.distanceTo(playerGroup.position);
            if (dist < 4) {
                document.getElementById('npc-name').textContent = npc.name;
                document.getElementById('npc-text').textContent = npc.dialog;
                dialogBox.style.display = 'block';
            }
        });
    }

    // Renderizado Continuo
    function animate() {
        requestAnimationFrame(animate);
        update();
        renderer.render(scene, camera);
    }

    // Ajuste de Pantalla Celular / PC
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>

</body>
</html>
