<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Abrahancito 3D - High Detail RPG Edition</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; color: white; }

        #game-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; background: #000; }
        #canvas-container { width: 100%; height: 100%; }

        #minimap-card {
            position: absolute; top: 12px; left: 12px;
            width: 90px; height: 90px; border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.6);
            overflow: hidden; z-index: 20;
        }
        #minimap { width: 100%; height: 100%; }

        #top-hud {
            position: absolute; top: 12px; left: 115px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 20;
        }

        #status-bar {
            background: rgba(15, 23, 42, 0.85); padding: 5px 10px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2); font-size: 10px; font-weight: bold;
        }
        .bar-wrap { width: 75px; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
        .hp-bar { width: 100%; height: 100%; background: #22c55e; transition: width 0.2s; }
        .mp-bar { width: 100%; height: 100%; background: #3b82f6; transition: width 0.2s; }

        #quest-hud {
            background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 12px;
            border: 1px solid #f59e0b; font-size: 10px; text-align: right; max-width: 200px;
        }

        #boss-bar-card {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 6px;
            border: 1px solid #ef4444; text-align: center; display: none; z-index: 20;
        }
        #boss-hp { width: 140px; height: 8px; background: #7f1d1d; border-radius: 4px; overflow: hidden; margin-top: 2px; }
        #boss-hp-fill { width: 100%; height: 100%; background: #ef4444; }

        #hotbar {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; background: rgba(15, 23, 42, 0.85);
            padding: 4px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); z-index: 30;
        }
        .slot {
            width: 42px; height: 42px; background: rgba(255,255,255,0.1);
            border: 2px solid #475569; border-radius: 6px; display: flex;
            align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer; position: relative;
        }
        .slot.active { border-color: #f59e0b; background: rgba(245, 158, 11, 0.3); }
        .slot-ammo { position: absolute; bottom: 1px; right: 2px; font-size: 8px; font-weight: bold; color: #cbd5e1; }

        #dpad {
            position: absolute; left: 15px; bottom: 15px; width: 105px; height: 105px;
            display: grid; grid-template-columns: repeat(3, 35px); grid-template-rows: repeat(3, 35px);
            z-index: 30; gap: 1px;
        }
        .dp-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .dp-btn:active { background: rgba(255,255,255,0.5); }

        #action-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
        .act-btn {
            position: absolute; pointer-events: auto; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.6);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; touch-action: manipulation; backdrop-filter: blur(2px);
        }
        .act-btn:active { background: rgba(255,255,255,0.5); }

        #btn-shoot { right: 20px; bottom: 20px; width: 58px; height: 58px; background: rgba(220, 38, 38, 0.5); border-color: #ef4444; }
        #btn-aim { right: 88px; bottom: 15px; width: 40px; height: 40px; }
        #btn-jump { right: 25px; bottom: 88px; width: 42px; height: 42px; }
        #btn-mount { right: 78px; bottom: 65px; width: 38px; height: 38px; background: rgba(234, 179, 8, 0.4); }
        #btn-interact { right: 125px; bottom: 60px; width: 38px; height: 38px; background: rgba(14, 165, 233, 0.5); }

        #dialogue-box {
            position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 450px; background: rgba(15, 23, 42, 0.95);
            border: 2px solid #f59e0b; border-radius: 8px; padding: 10px 14px;
            font-size: 12px; line-height: 1.4; display: none; z-index: 40;
        }

        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 6px; height: 6px; border: 2px solid rgba(255,255,255,0.8);
            border-radius: 50%; pointer-events: none; z-index: 10;
        }

        #fullscreen-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; color: white; padding: 20px;
        }
        #start-btn {
            margin-top: 15px; padding: 12px 24px; background: #2563eb; color: white;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="fullscreen-overlay">
        <h2>🎮 Cargar Mundo RPG Ampliado</h2>
        <p style="margin-top: 8px; font-size: 14px; color: #94a3b8;">Nuevos ambientes, montañas, IA de enemigos y sistema de montura.</p>
        <button id="start-btn">JUGAR AHORA</button>
    </div>

    <div id="game-container">
        <div id="canvas-container"></div>
        <div id="crosshair"></div>

        <div id="minimap-card">
            <canvas id="minimap" width="90" height="90"></canvas>
        </div>

        <div id="boss-bar-card">
            <div style="font-size:10px; font-weight:bold; color:#ef4444;">👑 CABALLERO CARMESÍ (BOSS)</div>
            <div id="boss-hp"><div id="boss-hp-fill"></div></div>
        </div>

        <div id="top-hud">
            <div id="status-bar">
                <div>LVL <span id="p-lvl" style="color:#f59e0b">1</span> (<span id="p-xp">0</span>/100 XP)</div>
                <div style="margin-top:2px;">HP <div class="bar-wrap"><div id="hp-bar" class="hp-bar"></div></div></div>
                <div style="margin-top:2px;">MP <div class="bar-wrap"><div id="mp-bar" class="mp-bar"></div></div></div>
                <div style="margin-top:2px; color:#a3e635;">🪵 Madera: <span id="wood-count">0</span></div>
            </div>
            <div id="quest-hud">
                <span id="quest-text" style="color:#fde047;">Misión: Habla con el Sabio (?)</span>
            </div>
        </div>

        <div id="dialogue-box">
            <div id="dialogue-speaker" style="color:#f59e0b; font-weight:bold; margin-bottom:3px;">NPC</div>
            <div id="dialogue-text">...</div>
        </div>

        <div id="hotbar">
            <div class="slot active" id="slot-0" onclick="selectSlot(0)">🗡️<span class="slot-ammo">Espada</span></div>
            <div class="slot" id="slot-1" onclick="selectSlot(1)">🪓<span class="slot-ammo">Hacha</span></div>
            <div class="slot" id="slot-2" onclick="selectSlot(2)">🔮<span class="slot-ammo">Báculo</span></div>
            <div class="slot" id="slot-3" onclick="selectSlot(3)">⚙️<span class="slot-ammo">Pistola</span></div>
        </div>

        <div id="dpad">
            <div></div><div class="dp-btn" id="btn-up">▲</div><div></div>
            <div class="dp-btn" id="btn-left">◀</div><div></div><div class="dp-btn" id="btn-right">▶</div>
            <div></div><div class="dp-btn" id="btn-down">▼</div><div></div>
        </div>

        <div id="action-layer">
            <div class="act-btn" id="btn-shoot">🎯</div>
            <div class="act-btn" id="btn-aim">🔍</div>
            <div class="act-btn" id="btn-jump">⬆️</div>
            <div class="act-btn" id="btn-mount">🐎</div>
            <div class="act-btn" id="btn-interact">💬</div>
        </div>
    </div>

<script>
    document.getElementById('start-btn').addEventListener('click', async () => {
        try {
            if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        } catch (e) {}
        document.getElementById('fullscreen-overlay').style.display = 'none';
        resize();
    });

    const MODEL_URLS = {
        player: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Fox/glTF-Binary/Fox.glb',
        horse: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Horse/glTF-Binary/Horse.glb',
        boss: 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMan/glTF-Binary/CesiumMan.glb',
        tree: 'https://raw.githubusercontent.com/KenneyNL/Kenney-Assets/main/3D/Nature%20Kit/tree_simple.glb'
    };

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.005);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const gltfLoader = new THREE.GLTFLoader();
    const minimapCtx = document.getElementById('minimap').getContext('2d');

    const ambientLight = new THREE.AmbientLight(0xc7d2fe, 0.7);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffedd5, 1.4);
    sun.position.set(60, 80, 40);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 300;
    const d = 100;
    sun.shadow.camera.left = -d; sun.shadow.camera.right = d;
    sun.shadow.camera.top = d; sun.shadow.camera.bottom = -d;
    scene.add(sun);

    let p = { lvl: 1, xp: 0, hp: 100, maxHp: 100, mp: 80, maxMp: 80, wood: 0, speed: 0.18, activeSlot: 0, questState: 0, mounted: false };
    const keys = { up: false, down: false, left: false, right: false };

    // --- ENTORNO: CÉSPED Y MONTAÑAS PERIMETRALES ---
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e3a29, roughness: 0.9, metalness: 0.1 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(350, 350), floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Montañas alrededor del mapa
    function createMountainRange() {
        const mountMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.95 });
        const numPeaks = 45;
        for(let i = 0; i < numPeaks; i++) {
            const angle = (i / numPeaks) * Math.PI * 2;
            const dist = 140 + Math.random() * 20;
            const h = 25 + Math.random() * 35;
            const r = 18 + Math.random() * 15;
            const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7), mountMat);
            cone.position.set(Math.cos(angle) * dist, h / 2, Math.sin(angle) * dist);
            cone.castShadow = true;
            cone.receiveShadow = true;
            scene.add(cone);
        }
    }
    createMountainRange();

    // --- PERSONAJE Y JINETE/MONTURA ---
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    let foxModel = null;
    let riderGroup = new THREE.Group();

    // Modelo normal (Zorro)
    gltfLoader.load(MODEL_URLS.player, (gltf) => {
        foxModel = gltf.scene;
        foxModel.scale.set(0.022, 0.022, 0.022);
        foxModel.rotation.y = Math.PI;
        foxModel.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        playerGroup.add(foxModel);
    }, undefined, () => {
        const pMat = new THREE.MeshStandardMaterial({ color: 0xea580c, roughness: 0.4 });
        foxModel = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 1.4), pMat);
        foxModel.position.y = 0.4;
        playerGroup.add(foxModel);
    });

    // Construcción del Jinete + Caballo
    gltfLoader.load(MODEL_URLS.horse, (gltf) => {
        const horse = gltf.scene;
        horse.scale.set(0.012, 0.012, 0.012);
        horse.rotation.y = Math.PI;
        horse.traverse(c => { if(c.isMesh) c.castShadow = true; });
        riderGroup.add(horse);

        // Jinete en la montura
        const riderBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3, 0.3, 0.9),
            new THREE.MeshStandardMaterial({ color: 0x0284c7 })
        );
        riderBody.position.set(0, 1.6, -0.1);
        riderBody.castShadow = true;
        riderGroup.add(riderBody);

        const riderHead = new THREE.Mesh(
            new THREE.SphereGeometry(0.25),
            new THREE.MeshStandardMaterial({ color: 0xfde047 })
        );
        riderHead.position.set(0, 2.2, -0.1);
        riderGroup.add(riderHead);
    }, undefined, () => {
        const hMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
        const horseFallback = new THREE.Mesh(new THREE.BoxGeometry(1, 1.2, 2), hMat);
        horseFallback.position.y = 0.6;
        riderGroup.add(horseFallback);
    });

    const playerAura = new THREE.PointLight(0x38bdf8, 0.8, 5);
    playerAura.position.set(0, 1.2, 0);
    playerGroup.add(playerAura);

    function toggleMount() {
        p.mounted = !p.mounted;
        if(p.mounted) {
            if(foxModel) playerGroup.remove(foxModel);
            playerGroup.add(riderGroup);
            p.speed = 0.32; // Mayor velocidad montado
            showDialogue("Sistema", "¡Has montado a tu caballo! (+Velocidad)");
        } else {
            playerGroup.remove(riderGroup);
            if(foxModel) playerGroup.add(foxModel);
            p.speed = 0.18;
            showDialogue("Sistema", "Has desmontado.");
        }
    }

    // --- EFECTOS DE PARTÍCULAS ---
    const particles = [];
    function spawnParticles(pos, colorHex, count = 12, speedMult = 1) {
        for(let i = 0; i < count; i++) {
            const pMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.05 + Math.random()*0.05, 6, 6),
                new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 })
            );
            pMesh.position.copy(pos);
            scene.add(pMesh);
            particles.push({
                mesh: pMesh,
                vel: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.16 * speedMult,
                    Math.random() * 0.14 * speedMult,
                    (Math.random() - 0.5) * 0.16 * speedMult
                ),
                life: 25 + Math.random() * 10
            });
        }
    }

    // --- BOSQUE Y ÁRBOLES ---
    const trees = [];
    function createTree(x, z) {
        const treeGroup = new THREE.Group();
        gltfLoader.load(MODEL_URLS.tree, (gltf) => {
            const m = gltf.scene.clone();
            m.scale.set(1.4, 1.4 + Math.random()*0.4, 1.4);
            m.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            treeGroup.add(m);
        }, undefined, () => {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.35, 1.6, 10), new THREE.MeshStandardMaterial({ color: 0x451a03 }));
            trunk.position.y = 0.8;
            treeGroup.add(trunk);
        });

        treeGroup.position.set(x, 0, z);
        scene.add(treeGroup);
        trees.push({ mesh: treeGroup, hp: 3, x, z });
    }

    for(let i=0; i<50; i++) {
        let rx = (Math.random() - 0.5) * 230;
        let rz = (Math.random() - 0.5) * 230;
        if(Math.abs(rx) > 12 || Math.abs(rz) > 12) {
            createTree(rx, rz);
        }
    }

    // --- NPCs ---
    const npcs = [
        { id: 'sabio', name: 'Sabio Erudito', pos: new THREE.Vector3(8, 0, 8), color: 0x0284c7 },
        { id: 'herrero', name: 'Herrero Vulcan', pos: new THREE.Vector3(-12, 0, 15), color: 0xd97706 },
        { id: 'guardian', name: 'Guardia del Castillo', pos: new THREE.Vector3(25, 0, -20), color: 0xdc2626 }
    ];

    npcs.forEach(npc => {
        const g = new THREE.Group();
        const b = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4, 12), new THREE.MeshStandardMaterial({ color: npc.color, roughness: 0.3 }));
        b.position.y = 0.7;
        b.castShadow = true;
        g.add(b);
        g.position.copy(npc.pos);
        scene.add(g);
        npc.mesh = g;
    });

    // --- MONSTRUOS E INTELIGENCIA ARTIFICIAL (IA) ---
    const enemies = [];
    function spawnEnemy(type, x, z) {
        const enemyGroup = new THREE.Group();
        let maxHp = 40;
        let isBoss = false;
        let isAggressive = type === 'demon' || type === 'boss'; // Demonios y Boss persiguen/atacan

        if (type === 'boss') {
            isBoss = true;
            maxHp = 300;
            gltfLoader.load(MODEL_URLS.boss, (gltf) => {
                const m = gltf.scene;
                m.scale.set(1.2, 1.2, 1.2);
                m.traverse(c => { if(c.isMesh) c.castShadow = true; });
                enemyGroup.add(m);
            });
            const bossLight = new THREE.PointLight(0xef4444, 1.5, 8);
            bossLight.position.set(0, 1.5, 0);
            enemyGroup.add(bossLight);
        } else {
            const color = isAggressive ? 0xdc2626 : 0x16a34a; // Rojo = Agresivo, Verde = Pasivo
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.5, 0.9), new THREE.MeshStandardMaterial({ color, roughness: 0.5 }));
            body.position.y = 0.75;
            body.castShadow = true;
            enemyGroup.add(body);
            maxHp = type === 'golem' ? 60 : 45;
        }

        enemyGroup.position.set(x, 0, z);
        scene.add(enemyGroup);
        enemies.push({
            mesh: enemyGroup,
            hp: maxHp,
            maxHp,
            isBoss,
            isAggressive,
            type,
            attackCooldown: 0,
            wanderTimer: Math.random() * 100,
            wanderDir: new THREE.Vector3((Math.random()-0.5), 0, (Math.random()-0.5)).normalize()
        });
    }

    spawnEnemy('golem', -15, 15);   // Pasivo
    spawnEnemy('demon', 15, -20);   // Agresivo
    spawnEnemy('golem', -25, -15);  // Pasivo
    spawnEnemy('demon', 30, 20);    // Agresivo
    spawnEnemy('boss', 35, -35);    // Boss Agresivo

    const vfxList = [];
    const projectiles = [];

    const randomLore = [
        "El Caballero Carmesí custodia las reliquias arcanas en el estanque del este.",
        "Los monstruos rojos son agresivos y te atacarán si te acercas.",
        "Los gólem verdes son pacíficos hasta que los desafías.",
        "Usa la montura para desplazarte rápidamente por las montañas."
    ];

    function selectSlot(i) {
        p.activeSlot = i;
        document.querySelectorAll('.slot').forEach((s, idx) => s.classList.toggle('active', idx === i));
    }

    function showDialogue(speaker, text) {
        const box = document.getElementById('dialogue-box');
        document.getElementById('dialogue-speaker').textContent = speaker;
        document.getElementById('dialogue-text').textContent = text;
        box.style.display = 'block';
        setTimeout(() => { box.style.display = 'none'; }, 4500);
    }

    // --- COMBATE ---
    function executeAttack() {
        if(p.activeSlot === 2) {
            if(p.mp >= 20) {
                p.mp -= 20;
                updateHUD();

                const orbGroup = new THREE.Group();
                const orb = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35, 12, 12),
                    new THREE.MeshStandardMaterial({ color: 0xc084fc, emissive: 0xa855f7, emissiveIntensity: 1.2 })
                );
                orbGroup.add(orb);
                
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
                orbGroup.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.2, 0));
                
                scene.add(orbGroup);
                projectiles.push({ mesh: orbGroup, dir, speed: 0.65, life: 60 });
                spawnParticles(playerGroup.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0xc084fc, 10);
            } else {
                showDialogue("Sistema", "¡Sin Maná suficiente!");
            }
            return;
        }

        if(p.activeSlot === 3) {
            const bullet = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.08, 0.4),
                new THREE.MeshBasicMaterial({ color: 0xf59e0b })
            );
            bullet.rotation.x = Math.PI / 2;
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            bullet.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.0, 0));
            scene.add(bullet);
            projectiles.push({ mesh: bullet, dir, speed: 0.9, life: 45 });
            spawnParticles(playerGroup.position.clone().add(new THREE.Vector3(0, 1.0, 0)), 0xf59e0b, 6, 1.5);
            return;
        }

        if(p.activeSlot === 0 || p.activeSlot === 1) {
            const slashColor = p.activeSlot === 1 ? 0x38bdf8 : 0xc084fc;
            const slash = new THREE.Mesh(
                new THREE.RingGeometry(0.6, 1.4, 12, 1, 0, Math.PI),
                new THREE.MeshBasicMaterial({ color: slashColor, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
            );
            slash.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1, 0));
            slash.rotation.copy(playerGroup.rotation);
            slash.rotation.x = Math.PI / 2;
            scene.add(slash);
            vfxList.push({ mesh: slash, life: 10 });

            spawnParticles(playerGroup.position.clone().add(new THREE.Vector3(0, 1, 0)), slashColor, 12);

            if(p.activeSlot === 1) {
                trees.forEach((t, i) => {
                    if(t.mesh.position.distanceTo(playerGroup.position) < 3.0) {
                        t.hp--;
                        spawnParticles(t.mesh.position.clone().add(new THREE.Vector3(0,1,0)), 0x78350f, 8);
                        if(t.hp <= 0) {
                            scene.remove(t.mesh);
                            trees.splice(i, 1);
                            p.wood += 3;
                            if(p.questState === 2 && p.wood >= 5) p.questState = 3;
                            updateHUD();
                        }
                    }
                });
            }

            enemies.forEach((enemy, i) => {
                if(enemy.mesh.position.distanceTo(playerGroup.position) < 3.8) {
                    damageEnemy(enemy, i, 25);
                }
            });
        }
    }

    function damageEnemy(enemy, index, amount) {
        enemy.hp -= amount;
        enemy.isAggressive = true; // Si es atacado, se vuelve agresivo
        spawnParticles(enemy.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xef4444, 15);

        if(enemy.isBoss) {
            document.getElementById('boss-bar-card').style.display = 'block';
            document.getElementById('boss-hp-fill').style.width = `${Math.max(0, (enemy.hp / enemy.maxHp)*100)}%`;
        }
        if(enemy.hp <= 0) {
            if(enemy.isBoss) {
                document.getElementById('boss-bar-card').style.display = 'none';
                if(p.questState === 4) p.questState = 5;
            }
            scene.remove(enemy.mesh);
            enemies.splice(index, 1);
            p.xp += enemy.isBoss ? 250 : 45;
            if(p.questState === 1) p.questState = 2;
            updateHUD();
        }
    }

    function interactNPC() {
        npcs.forEach(npc => {
            if(playerGroup.position.distanceTo(npc.pos) < 4) {
                if(npc.id === 'sabio') {
                    if(p.questState === 0) { p.questState = 1; showDialogue(npc.name, "Derrota a las criaturas del valle para demostrar tu valía."); }
                    else if(p.questState === 2) { showDialogue(npc.name, "¡Gran avance! Ve a buscar al Herrero al oeste."); }
                    else showDialogue(npc.name, randomLore[Math.floor(Math.random()*randomLore.length)]);
                }
                else if(npc.id === 'herrero') {
                    if(p.questState === 2) { showDialogue(npc.name, "Trae 5 maderas cortadas con el Hacha."); }
                    else if(p.questState === 3) { p.questState = 4; p.xp += 100; showDialogue(npc.name, "¡Maderas listas! Enfréntate al Caballero Carmesí."); }
                    else showDialogue(npc.name, "Puedo forjar artefactos arcanos únicos.");
                }
                else if(npc.id === 'guardian') {
                    if(p.questState === 4) showDialogue(npc.name, "¡El Caballero Carmesí aguarda en el este!");
                    else if(p.questState === 5) { p.questState = 6; p.xp += 300; p.lvl += 2; showDialogue(npc.name, "¡Has liberado el reino de la oscuridad!"); }
                    else showDialogue(npc.name, "El acceso al castillo está despejado.");
                }
                updateHUD();
            }
        });
    }

    function updateHUD() {
        document.getElementById('p-lvl').textContent = p.lvl;
        document.getElementById('p-xp').textContent = p.xp;
        document.getElementById('hp-bar').style.width = `${Math.max(0, p.hp)}%`;
        document.getElementById('mp-bar').style.width = `${(p.mp / p.maxMp)*100}%`;
        document.getElementById('wood-count').textContent = p.wood;

        const qText = document.getElementById('quest-text');
        if(p.questState === 0) qText.textContent = "Misión: Habla con el Sabio (?)";
        else if(p.questState === 1) qText.textContent = "Misión: Elimina a un monstruo";
        else if(p.questState === 2) qText.textContent = "Misión: Junta 5 maderas para el Herrero";
        else if(p.questState === 3) qText.textContent = "¡Lleva la madera al Herrero (!)";
        else if(p.questState === 4) qText.textContent = "Misión: Vence al Caballero Carmesí (Boss)";
        else if(p.questState === 5) qText.textContent = "¡Informa tu victoria al Guardia (!)";
        else qText.textContent = "¡Todas las Misiones Completadas!";
    }

    function bind(id, fn) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e)=>{ e.preventDefault(); fn(); });
        el.addEventListener('click', fn);
    }
    bind('btn-shoot', executeAttack);
    bind('btn-interact', interactNPC);
    bind('btn-mount', toggleMount);

    function bindDir(id, k) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e)=>{e.preventDefault(); keys[k]=true;});
        el.addEventListener('touchend', (e)=>{e.preventDefault(); keys[k]=false;});
    }
    bindDir('btn-up','up'); bindDir('btn-down','down');
    bindDir('btn-left','left'); bindDir('btn-right','right');

    function drawMinimap() {
        minimapCtx.clearRect(0,0,90,90);
        const cx = 45, cy = 45, scale = 0.4;

        minimapCtx.fillStyle = '#0f172a';
        minimapCtx.fillRect(0,0,90,90);

        enemies.forEach(enemy => {
            let ex = (enemy.mesh.position.x - playerGroup.position.x) * scale;
            let ez = (enemy.mesh.position.z - playerGroup.position.z) * scale;
            
            if(Math.abs(ex) < 40 && Math.abs(ez) < 40) {
                minimapCtx.fillStyle = enemy.isBoss ? '#f59e0b' : (enemy.isAggressive ? '#ef4444' : '#22c55e');
                minimapCtx.beginPath();
                minimapCtx.arc(cx + ex, cy + ez, enemy.isBoss ? 4 : 2.5, 0, Math.PI * 2);
                minimapCtx.fill();
            }
        });

        npcs.forEach(npc => {
            let nx = (npc.pos.x - playerGroup.position.x) * scale;
            let nz = (npc.pos.z - playerGroup.position.z) * scale;
            
            if(Math.abs(nx) < 40 && Math.abs(nz) < 40) {
                minimapCtx.font = 'bold 11px sans-serif';
                if((p.questState === 0 && npc.id==='sabio') || (p.questState === 2 && npc.id==='herrero') || (p.questState === 4 && npc.id==='guardian')) {
                    minimapCtx.fillStyle = '#3b82f6';
                    minimapCtx.fillText('?', cx + nx - 3, cy + nz + 4);
                } else if((p.questState === 3 && npc.id==='herrero') || (p.questState === 5 && npc.id==='guardian')) {
                    minimapCtx.fillStyle = '#f59e0b';
                    minimapCtx.fillText('!', cx + nx - 3, cy + nz + 4);
                } else {
                    minimapCtx.fillStyle = '#38bdf8';
                    minimapCtx.beginPath();
                    minimapCtx.arc(cx + nx, cy + nz, 2, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            }
        });

        minimapCtx.save();
        minimapCtx.translate(cx, cy);
        minimapCtx.rotate(-playerGroup.rotation.y);
        minimapCtx.fillStyle = '#ffffff';
        minimapCtx.beginPath();
        minimapCtx.moveTo(0, -4); minimapCtx.lineTo(3, 3); minimapCtx.lineTo(-3, 3);
        minimapCtx.closePath(); minimapCtx.fill();
        minimapCtx.restore();
    }

    function resize() {
        let w = window.innerWidth;
        let h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', resize);

    function animate() {
        requestAnimationFrame(animate);

        // Control del personaje
        if (keys.left) playerGroup.rotation.y += 0.04;
        if (keys.right) playerGroup.rotation.y -= 0.04;
        if (keys.up) playerGroup.translateZ(-p.speed);
        if (keys.down) playerGroup.translateZ(p.speed);

        if(p.mp < p.maxMp) {
            p.mp += 0.05;
            updateHUD();
        }

        // LÓGICA E IA DE LOS ENEMIGOS
        enemies.forEach((enemy) => {
            const dist = enemy.mesh.position.distanceTo(playerGroup.position);

            if (enemy.isAggressive && dist < 18) {
                // Persecución si está en rango
                enemy.mesh.lookAt(playerGroup.position.x, enemy.mesh.position.y, playerGroup.position.z);
                enemy.mesh.translateZ(0.06);

                // Ataque al jugador
                if (dist < 1.8) {
                    if (enemy.attackCooldown <= 0) {
                        p.hp -= 10;
                        enemy.attackCooldown = 50; // Delay entre golpes
                        spawnParticles(playerGroup.position.clone().add(new THREE.Vector3(0, 1, 0)), 0xef4444, 8);
                        updateHUD();
                        if (p.hp <= 0) {
                            p.hp = p.maxHp;
                            playerGroup.position.set(0, 0, 0); // Respawn
                            showDialogue("Sistema", "¡Has sido derrotado! Reapareces en la aldea.");
                        }
                    }
                }
            } else {
                // Comportamiento pasivo / Vagar libremente
                enemy.wanderTimer--;
                if (enemy.wanderTimer <= 0) {
                    enemy.wanderTimer = 80 + Math.random() * 100;
                    enemy.wanderDir.set((Math.random() - 0.5), 0, (Math.random() - 0.5)).normalize();
                }
                enemy.mesh.position.addScaledVector(enemy.wanderDir, 0.02);
            }

            if (enemy.attackCooldown > 0) enemy.attackCooldown--;
        });

        // Partículas
        particles.forEach((pt, index) => {
            pt.mesh.position.add(pt.vel);
            pt.life--;
            if(pt.life <= 0) {
                scene.remove(pt.mesh);
                particles.splice(index, 1);
            }
        });

        // Proyectiles
        projectiles.forEach((proj, prIndex) => {
            proj.mesh.position.addScaledVector(proj.dir, proj.speed);
            proj.life--;

            enemies.forEach((enemy, eIndex) => {
                if(proj.mesh.position.distanceTo(enemy.mesh.position) < 2.0) {
                    damageEnemy(enemy, eIndex, 40);
                    proj.life = 0;
                }
            });

            if(proj.life <= 0) {
                scene.remove(proj.mesh);
                projectiles.splice(prIndex, 1);
            }
        });

        // VFX
        vfxList.forEach((v, i) => {
            v.life--;
            if(v.life <= 0) {
                scene.remove(v.mesh);
                vfxList.splice(i, 1);
            }
        });

        // Cámara
        const offset = new THREE.Vector3(0, 3.5, 6.0).applyMatrix4(playerGroup.matrixWorld);
        camera.position.lerp(offset, 0.1);
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

        drawMinimap();
        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
</html>
